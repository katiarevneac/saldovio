name: CI

on:
  pull_request:
    branches: [main]

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test

  finance-api:
    name: finance-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saldovio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saldovio_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: finance-api/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx tsc -p tsconfig.build.json --noEmit

      - run: npm run lint

      - run: npm test

  analytics-service:
    name: analytics-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest -v
